version: '3.8' 

services: 
  backend: 
    build: 
      context: ./desafio-backend 
      dockerfile: Dockerfile 
    ports: 
      - "3002:3002" 
    environment: 
      - PORT=3002 
      
  frontend: 
    build: 
      context: ./desafio-frontend 
      dockerfile: Dockerfile 
    ports: 
      - "3000:3000" 
    environment: 
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on: 
      - backend